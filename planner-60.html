<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>规划看板已下线</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --card: #fffdfa;
      --text: #2c241d;
      --muted: #72675b;
      --border: #dfd4c5;
      --primary: #9b4d27;
      --primary-text: #ffffff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 10% 20%, #fbf8f3 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 16px 40px rgba(71, 46, 24, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--primary);
      color: var(--primary-text);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>规划看板已下线</h1>
    <p>旧版规划看板已下线并完成备份归档。请前往主控制台进行日程管理。</p>
    <a href="/">返回主控制台</a>
  </main>
</body>
</html>
